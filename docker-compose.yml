services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vital-watch-db
    environment:
      POSTGRES_DB: vital_watch_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vital-watch-backend
    environment:
      PORT: 5000
      JWT_SECRET: your-secret-key
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vital_watch_db
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  geoserver:
    image: kartoza/geoserver:latest
    container_name: vital-watch-geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./infrastructure/geoserver/rasters:/opt/geoserver/rasters:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vital-watch-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000
      VITE_GEOSERVER_BASE_URL: http://localhost:8080
      VITE_GEOSERVER_WMS_URL: http://localhost:8080/geoserver/wms
      VITE_GEOSERVER_WORKSPACE: raster
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      VITE_DOCKER_DEV: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
      - geoserver
    restart: unless-stopped

  geoserver-init:
    image: curlimages/curl
    container_name: vital-watch-geoserver-init
    depends_on:
      - geoserver
    volumes:
      - ./scripts/publish_rasters.sh:/scripts/publish_rasters.sh:ro
      - ./scripts/wait-for-geoserver.sh:/scripts/wait-for-geoserver.sh:ro
      - ./infrastructure/geoserver/rasters:/infrastructure/geoserver/rasters:ro
    command: sh /scripts/wait-for-geoserver.sh
    restart: on-failure

volumes:
  postgres_data:
  geoserver_data:
